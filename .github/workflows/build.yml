# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: Build
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list-versions.outputs.versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Setup cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build
        run: ./gradlew build

      - name: List built versions
        id: list-versions
        run: |
          versions=$(ls versions | jq -R -s -c 'split("\n")[:-1]')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

      - name: Upload Jar zip
        uses: actions/upload-artifact@v7
        with:
          name: solstice-jars
          path: |
            versions/**/build/libs/*.jar
            !versions/**/build/libs/*-sources.jar

  upload-artifacts:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ${{ fromJSON(needs.build.outputs.versions) }}
    steps:
      - name: Download jars
        uses: actions/download-artifact@v6
        with:
          name: solstice-jars
          path: jars

      - name: Upload (${{ matrix.version }})
        uses: actions/upload-artifact@v7
        with:
          name: solstice-${{ matrix.version }}
          path: jars/**/*${{ matrix.version }}.jar
          archive: 'false'
